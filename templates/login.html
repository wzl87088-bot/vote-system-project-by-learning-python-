<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>用户登录</title>
</head>
<body>
    <h1>用户登录</h1>
    <p>{{ hint }}</p>

    <form method="post" action="/login/">
        {% csrf_token %}

        <p>
            用户名：
            <input name="username" required>
        </p>
        <p>
            密码：
            <input type="password" name="password" required>
        </p>
        <p>
        验证码：
            <input name="captcha" maxlength="4" required>
            <img src="/captcha/" alt="验证码" width="160" height="60">
        </p>
        <button type="submit">登录</button>
    </form>

    <a href="/">返回首页</a>
</body>
</html>
