<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset = 'UTF-8'>
    <title>学科信息</title>
</head>
<body>
    {% if request.session.userid %}
    <p>欢迎，{{ request.session.username }}</p>

    <form method="post" action="/logout/">
        {% csrf_token %}
        <button type="submit">退出登录</button>
    </form>
{% else %}
    <a href="/login/">登录</a>
{% endif %}
    <h1>所有学科</h1>
    {% for subject in subjects%}
        <h2>
            <a href="/teachers/?sno={{subject.no}}">{{subject.name}}</a>
        </h2>
        <p>{{subject.intro}}</p>
    {% endfor %}
</body>
</html>
